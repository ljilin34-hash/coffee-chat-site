<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>往期回顾 · Coffee Chat</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="scroll-progress"></div>

  <nav class="cc-topbar" aria-label="主导航">
    <a href="index.html#top" class="cc-topbar-logo">
      <span class="cc-topbar-mark">☕</span>
      <span class="cc-topbar-text"><b>郭仔</b><i>Coffee Chat</i></span>
    </a>
    <div class="cc-topbar-nav">
      <a href="index.html">首页</a>
      <a href="index.html#about">主理人</a>
      <a href="index.html#themes">主题</a>
      <a href="about.html">关于</a>
      <a href="index.html#faq">FAQ</a>
    </div>
    <a class="cc-topbar-cta" href="index.html#contact">约下一场 ↗</a>
  </nav>

  <section class="cc-pagehero">
    <div class="container">
      <a href="index.html" class="cc-backlink">← 返回首页</a>
      <h1>往期回顾</h1>
      <p>从第一杯咖啡到现在，完整的旅程记录。每一场都带着真实的对话和收获。</p>
    </div>
  </section>

  <section class="cc-page-section cc-page-section-alt">
    <div class="container">
      <div class="cc-page-subhead">FULL TIMELINE</div>
      <h2 class="cc-page-h2">全部活动</h2>
      <div class="timeline" id="timeline-all" style="margin-top:28px;"></div>
    </div>
  </section>

  <section class="cc-page-section">
    <div class="container">
      <div class="cc-page-subhead">PHOTOS</div>
      <h2 class="cc-page-h2">活动现场</h2>
      <p style="font-size:15px;color:var(--text-light);margin-bottom:28px;">真实的围坐、真实的对话。点击照片可放大查看。</p>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <footer class="footer" id="contact">
    <div class="footer-inner">
      <div class="footer-cta">
        <h3>想来聊聊吗？</h3>
        <p>下一场 Coffee Chat，给你留个位置。</p>
        <div class="footer-qr">
          <img class="footer-qr-img" src="assets/photos/wechat-qr.jpeg" alt="微信二维码">
          <span class="footer-qr-label">扫码加主理人微信</span>
        </div>
        <a class="footer-btn" href="mailto:hi@coffeechat.club">联系主理人</a>
      </div>
      <div class="footer-meta">
        <p>&copy; 2026 郭仔 Coffee Chat · 行业跨界交流沙龙</p>
        <p>线下主题交流活动 · 10-15 人小范围深度对谈 · 杭州</p>
      </div>
    </div>
  </footer>

  <script src="assets/app.js"></script>
  <script>
    const timelineContainer = document.getElementById('timeline-all');
    renderTimeline(activities, timelineContainer, '');

    const galleryGrid = document.getElementById('gallery-grid');
    if (galleryGrid) {
      renderGallery(activities.slice().reverse(), galleryGrid, '');
    }

    const topbar = document.querySelector('.cc-topbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 30) topbar.classList.add('is-scrolled');
      else topbar.classList.remove('is-scrolled');
    }, { passive: true });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>
</body>
</html>
