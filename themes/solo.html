<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一人公司 - Coffee Chat</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="scroll-progress"></div>
  <!-- 导航栏 -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Coffee Chat</a>
      <div class="nav-links">
        <a href="../index.html">首页</a>
        <a href="../index.html#themes">主题</a>
        <a href="../about.html">关于</a>
        <a href="../archive.html">往期回顾</a>
      </div>
      <button class="nav-toggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay"></div>

  <!-- ① 主题 Hero -->
  <section class="theme-hero">
    <div class="theme-hero-glow" id="themeGlow"></div>
    <div class="container">
      <div class="theme-hero-content">
        <a href="../index.html#themes" class="theme-back">← 返回主题</a>
        <h1 class="theme-hero-title" id="themeTitle"></h1>
        <p class="theme-hero-tagline" id="themeTagline"></p>
      </div>
    </div>
  </section>

  <!-- ② 主题时间线 -->
  <section class="section">
    <div class="container">
      <p class="theme-journey-label" id="journeyLabel"></p>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- ③ 玩法说明 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">这个主题聊什么</h2>
      <div class="theme-play-card reveal">
        <p class="theme-play-desc" id="playDesc"></p>
        <div class="theme-play-suitable">
          <span class="suitable-label">适合谁来：</span><span id="playSuitable"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ④ 参与者反馈 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">参与者反馈</h2>
      <div class="quotes-grid" id="quotesGrid"></div>
    </div>
  </section>

  <!-- ⑤ 相邻主题导航 -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">继续探索</h2>
      <div class="theme-nav">
        <div class="theme-nav-grid" id="themeNav"></div>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-cta">
        <h3>想来聊聊吗？</h3>
        <p>每场 10-15 人，付费参加，认真交流</p>
        <div class="footer-qr">
          <img class="footer-qr-img" src="../assets/photos/wechat-qr.jpeg" alt="微信二维码">
          <span class="footer-qr-label">扫码加主理人微信</span>
        </div>
        <a href="../index.html" class="footer-btn">报名下一场</a>
      </div>
      <div class="footer-meta">
        <p>© 2026 Coffee Chat · 行业跨界交流沙龙 · 杭州</p>
      </div>
    </div>
  </footer>

  <script src="../assets/app.js"></script>
  <script>
    const THEME_SLUG = 'solo';
    const theme = getTheme(THEME_SLUG);
    const themeActivities = getActivitiesByTheme(THEME_SLUG);

    document.title = theme.name + ' - Coffee Chat';

    // ① Hero
    document.getElementById('themeGlow').style.background =
      `radial-gradient(ellipse at center, ${theme.accentColor}, transparent 70%)`;
    const titleEl = document.getElementById('themeTitle');
    titleEl.textContent = theme.name;
    titleEl.style.color = theme.accentColor;
    document.getElementById('themeTagline').textContent = theme.tagline;

    // ② Timeline
    const journeyLabel = document.getElementById('journeyLabel');
    const timelineEl = document.getElementById('timeline');
    if (themeActivities.length > 0) {
      journeyLabel.textContent = `这是 ${theme.name}的旅程 · 已办 ${themeActivities.length} 场`;
      renderTimeline(themeActivities, timelineEl, '../');
    } else {
      journeyLabel.textContent = `这是 ${theme.name}的旅程 · 已办 0 场`;
      timelineEl.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:var(--space-md) 0;">这个主题还在筹备中，敬请期待</p>';
    }

    // ③ Play card
    document.getElementById('playDesc').textContent = theme.description;
    document.getElementById('playSuitable').textContent = theme.suitableFor;

    // ④ Quotes
    const quotesGrid = document.getElementById('quotesGrid');
    const quoted = themeActivities.filter(a => a.quote);
    quotesGrid.innerHTML = quoted.length > 0
      ? quoted.map(a => `
        <div class="quote-card reveal">
          <blockquote>"${a.quote}"</blockquote>
          <cite>— ${a.quoteAuthor || '匿名'} · ${a.dateLabel}</cite>
        </div>`).join('')
      : '<p style="color:var(--text-light);">暂无参与者反馈</p>';

    // ⑤ Theme nav (仅显示非隐藏主题)
    const visibleThemes = themes.filter(t => !t.hidden);
    const idx = visibleThemes.findIndex(t => t.slug === THEME_SLUG);
    const prev = idx > 0 ? visibleThemes[idx - 1] : null;
    const next = idx < visibleThemes.length - 1 ? visibleThemes[idx + 1] : null;
    const themeNav = document.getElementById('themeNav');
    let navHtml = '';
    if (prev) {
      navHtml += `<a href="./${prev.slug}.html" class="theme-nav-card reveal">
        <span class="theme-nav-dir">← 上一主题</span>
        <span class="theme-nav-name">${prev.name}</span>
      </a>`;
    } else {
      navHtml += '<div class="theme-nav-card theme-nav-empty"></div>';
    }
    if (next) {
      navHtml += `<a href="./${next.slug}.html" class="theme-nav-card theme-nav-next reveal">
        <span class="theme-nav-dir">下一主题 →</span>
        <span class="theme-nav-name">${next.name}</span>
      </a>`;
    } else {
      navHtml += '<div class="theme-nav-card theme-nav-next theme-nav-empty"></div>';
    }
    themeNav.innerHTML = navHtml;

    // Section titles use theme accent color
    document.querySelectorAll('.section-title').forEach(el => {
      el.style.color = theme.accentColor;
      el.style.borderColor = theme.accentColor;
    });

    // Observe reveal elements (including dynamically added ones)
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
