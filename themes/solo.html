<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一人公司专场 - Coffee Chat</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <div class="scroll-progress"></div>

  <nav class="cc-topbar" aria-label="主导航">
    <a href="../index.html#top" class="cc-topbar-logo">
      <span class="cc-topbar-mark">☕</span>
      <span class="cc-topbar-text"><b>郭仔</b><i>Coffee Chat</i></span>
    </a>
    <div class="cc-topbar-nav">
      <a href="../index.html">首页</a>
      <a href="../index.html#about">主理人</a>
      <a href="../index.html#cases">已办</a>
      <a href="../index.html#themes">主题</a>
      <a href="../index.html#flow">流程</a>
      <a href="../index.html#faq">FAQ</a>
    </div>
    <a class="cc-topbar-cta" href="../index.html#contact">约下一场 ↗</a>
  </nav>

  <section class="cc-pagehero" id="themeHero">
    <div class="container">
      <a href="../index.html#themes" class="cc-backlink">← 返回主题</a>
      <h1 id="themeTitle"></h1>
      <p id="themeTagline"></p>
    </div>
  </section>

  <section class="cc-page-section cc-page-section-alt">
    <div class="container">
      <div class="cc-page-subhead">TIMELINE</div>
      <h2 class="cc-page-h2" id="journeyLabel"></h2>
      <div class="timeline" id="timeline" style="margin-top:28px;"></div>
    </div>
  </section>

  <section class="cc-page-section">
    <div class="container">
      <div class="cc-page-subhead">THE PLAY</div>
      <h2 class="cc-page-h2">这个主题聊什么</h2>
      <div class="cc-flow-card reveal" style="max-width:860px;margin-top:24px;">
        <div class="cc-flow-card-number">ABOUT</div>
        <p id="playDesc" style="margin-top:6px;"></p>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:14px;color:var(--text-light)">
          <span style="font-weight:700;color:var(--cc-black)">适合谁来：</span><span id="playSuitable"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="cc-page-section cc-page-section-alt">
    <div class="container">
      <div class="cc-page-subhead">FEEDBACK</div>
      <h2 class="cc-page-h2">参与者反馈</h2>
      <div class="quotes-grid" id="quotesGrid" style="margin-top:24px;"></div>
    </div>
  </section>

  <section class="cc-page-section">
    <div class="container">
      <div class="cc-page-subhead">EXPLORE MORE</div>
      <h2 class="cc-page-h2">继续探索</h2>
      <div class="theme-nav" style="margin-top:24px;">
        <div class="theme-nav-grid" id="themeNav"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-cta">
        <h3>想来聊聊吗？</h3>
        <p>每场 10-15 人，付费参加，认真交流</p>
        <div class="footer-qr">
          <img class="footer-qr-img" src="../assets/photos/wechat-qr.jpeg" alt="微信二维码">
          <span class="footer-qr-label">扫码加主理人微信</span>
        </div>
        <a href="../index.html" class="footer-btn">报名下一场</a>
      </div>
      <div class="footer-meta">
        <p>&copy; 2026 郭仔 Coffee Chat · 行业跨界交流沙龙</p>
        <p>线下主题交流活动 · 10-15 人小范围深度对谈 · 杭州</p>
      </div>
    </div>
  </footer>

  <script src="../assets/app.js"></script>
  <script>
    const THEME_SLUG = 'solo';
    const theme = getTheme(THEME_SLUG);
    const themeActivities = getActivitiesByTheme(THEME_SLUG);

    document.title = theme.name + ' - Coffee Chat';
    document.getElementById('themeTitle').textContent = theme.name;
    document.getElementById('themeTagline').textContent = theme.tagline;

    const journeyLabel = document.getElementById('journeyLabel');
    const timelineEl = document.getElementById('timeline');
    if (themeActivities.length > 0) {
      journeyLabel.textContent = '已办 ' + themeActivities.length + ' 场';
      renderTimeline(themeActivities, timelineEl, '../');
    } else {
      journeyLabel.textContent = '即将开启';
      timelineEl.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:40px 0;">这个主题还在筹备中，敬请期待</p>';
    }

    document.getElementById('playDesc').textContent = theme.description;
    document.getElementById('playSuitable').textContent = theme.suitableFor;

    const quotesGrid = document.getElementById('quotesGrid');
    const quoted = themeActivities.filter(a => a.quote);
    quotesGrid.innerHTML = quoted.length > 0
      ? quoted.map(a => '<div class="quote-card reveal"><blockquote>"' + a.quote + '"</blockquote><cite>&mdash; ' + (a.quoteAuthor || '匿名') + ' · ' + a.dateLabel + '</cite></div>').join('')
      : '<p style="color:var(--text-light);">这个主题即将开启，期待第一场对话</p>';

    const visibleThemes = themes.filter(t => !t.hidden);
    const idx = visibleThemes.findIndex(t => t.slug === THEME_SLUG);
    const prev = idx > 0 ? visibleThemes[idx - 1] : null;
    const next = idx < visibleThemes.length - 1 ? visibleThemes[idx + 1] : null;
    const themeNav = document.getElementById('themeNav');
    let navHtml = '';
    if (prev) navHtml += '<a href="./' + prev.slug + '.html" class="theme-nav-card reveal"><span class="theme-nav-dir">← 上一主题</span><span class="theme-nav-name">' + prev.name + '</span></a>';
    else navHtml += '<div class="theme-nav-card theme-nav-empty"></div>';
    if (next) navHtml += '<a href="./' + next.slug + '.html" class="theme-nav-card theme-nav-next reveal"><span class="theme-nav-dir">下一主题 →</span><span class="theme-nav-name">' + next.name + '</span></a>';
    else navHtml += '<div class="theme-nav-card theme-nav-next theme-nav-empty"></div>';
    themeNav.innerHTML = navHtml;

    const topbar = document.querySelector('.cc-topbar');
    window.addEventListener('scroll', () => { if (window.scrollY > 30) topbar.classList.add('is-scrolled'); else topbar.classList.remove('is-scrolled'); }, { passive: true });

    const observer = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
